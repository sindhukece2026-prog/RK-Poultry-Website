<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery - RK Poultry Farm</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="nav">

            <!-- LOGO -->

            <a href="./index.html" class="logo">

                <img
                    src="imges/logo.png"
                    alt="RK Poultry Farm & Egg Production"
                >

            </a>


            <!-- NAVIGATION -->

            <nav class="nav-links">

                <a href="./index.html">
                    Home
                </a>

                <a href="./about.html">
                    About Us
                </a>

                <a href="./product.html">
                    Products
                </a>

                <a href="./egg-production.html">
                    Egg Production
                </a>

                <a href="./gallery.html" class="active">
                    Gallery
                </a>

                <a href="./contact.html">
                    Contact
                </a>

            </nav>


            <!-- RIGHT SIDE -->

            <div class="header-right">

                <!-- SEARCH -->

                <div class="search-box">

                    <span class="search-icon">

                        <svg viewBox="0 0 24 24">

                            <circle
                                cx="11"
                                cy="11"
                                r="6"
                            ></circle>

                            <line
                                x1="15.5"
                                y1="15.5"
                                x2="20"
                                y2="20"
                            ></line>

                        </svg>

                    </span>

                    <input
                        type="text"
                        placeholder="Search products..."
                    >

                </div>


                <!-- CART -->

                <a href="cart.html" class="cart">

                    🛒

                    <span>0</span>

                </a>


                <!-- ORDER NOW -->

                <a href="#" class="order-btn">
                    Order Now
                </a>

            </div>


            <!-- MOBILE MENU -->

            <button
                class="menu-btn"
                id="menuBtn"
            >
                ☰
            </button>

        </div>


        <!-- MOBILE NAVIGATION -->

        <div
            class="mobile-menu"
            id="mobileMenu"
        >

            <a href="./index.html">
                Home
            </a>

            <a href="./about.html">
                About Us
            </a>

            <a href="./product.html">
                Products
            </a>

            <a href="./egg-production.html">
                Egg Production
            </a>

            <a href="./gallery.html">
                Gallery
            </a>

            <a href="./contact.html">
                Contact
            </a>

        </div>

    </header>



    <!-- ================= GALLERY ================= -->

    <main class="gallery-page">


        <!-- PAGE HEADING -->

        <section class="gallery-header">

            <h1>
                Gallery
            </h1>

            <p>
                A glimpse of our farm, poultry and egg supply
            </p>

        </section>



        <!-- ================= GALLERY GRID ================= -->

        <section class="gallery-content">

            <div class="gallery-container">


                <div class="gallery-item">

                    <img
                        src="imges/homepage_img.png"
                        alt="RK Poultry Farm"
                    >

                </div>


                <div class="gallery-item">

                    <img
                        src="imges/individual_eggs.png"
                        alt="Farm Fresh Eggs"
                    >

                </div>


                <div class="gallery-item">

                    <img
                        src="imges/single_tray.png"
                        alt="Egg Trays"
                    >

                </div>


                <div class="gallery-item">

                    <img
                        src="imges/bulk_egg.png"
                        alt="Bulk Egg Supply"
                    >

                </div>


            </div>

        </section>


    </main>



    <!-- ================= JAVASCRIPT ================= -->

    <script src="script.js"></script>

</body>

</html>
